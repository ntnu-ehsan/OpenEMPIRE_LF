# This is an OpenEMPIRE configuration file.
# To be used with the execution script run.py

use_temporary_directory: True                          # Specifies whether to use a temporary directory for operations
temporary_directory: './'                              # Path to the temporary directory used for certain operations
forecast_horizon_year: 2030                            # Target or end year for the cluster run
number_of_scenarios: 1                                 # Number of scenarios in every investment period (limited by sampling_key.csv)
length_of_regular_season: 168                        # Number of hours in a regular season (weekly; matches seasonScale ~12.96 x 4 seasons)
discount_rate: 0.05                                    # Rate used to discount future cash flows to present value
wacc: 0.05                                             # Weighted average cost of capital
optimization_solver: "Gurobi"                          # Mathematical solver used for optimization tasks
use_scenario_generation: True                          # Indicates if scenarios should be generated dynamically
use_fixed_sample: True                                 # Reproduce the cluster tree from sampling_key.csv in LF_ES_GoRES/ScenarioData (must be present; set False to generate a fresh sample + key)
load_change_module: False                              #
filter_make : False                                    #
filter_use : False                                     #
copula_clusters_make: False                            # Make copula clusters (for copula-strata SGR)
copula_clusters_use: False                             # Copula-based scenario generation (strata/filter approach)
copulas_to_use: ["electricload"]                       # Emprical copula construction of ["electricload", "hydroror", "hydroseasonal", "solar", "windoffshore", "windonshore"]
n_cluster : 8                                         #
moment_matching : False                                #
n_tree_compare : 20                                    # Number of trees to compare for moment matching and copula-sampling
use_emission_cap: True                                 # Indicates if there's a cap on CO2 emissions
compute_operational_duals: False                        # Resolve empire with fixed investment variables and write new duals
print_in_iamc_format: False                             # Output should be printed in a IAMC-compatible format
write_in_lp_format: False                              # Problem should be written in Linear Programming format
serialize_instance: False                              # Serialize the data structure or model for later use
north_sea: True                                       # Dataset has separate 'Wind offshore grounded' + 'Wind offshore floating' generators; True makes the scenario generator emit Windoffshoregrounded/Windoffshorefloating availability (False would emit a single 'Windoffshore' that doesn't exist here)
aggregate_offshore_nodes_in_IAMC: False                 # Aggregate offshore nodes into closest onshore node in IAMC output (requires north_sea: True)
leap_years_investment: 5                               # Number of years per period (default: 5)
time_format: "%d/%m/%Y %H:%M"                          # Time format for scenario data files
use_ramping: False                                     # Include thermal ramp-rate constraints. Set False to drop inter-hour coupling for thermal units (faster, but only if ramping is non-binding)
generation_growth_limit_flag: True                     # Cap total node generation (all technologies summed) at (1+rate)x the previous period's expected generation
generation_growth_limit_rate: 0.3                      # Max fractional growth per period when the flag is on (0.3 = 30%, matches the reference model's hardcoded 1.3)
biomass_limit_flag: True                               # Cap system-wide annual biomass generation using the optional 'BiomassMaxAnnualActivity' sheet in Node.xlsx. Datasets without that sheet are unaffected
biomass_limit_factor: 1.2                              # Allowed multiple of the supplied biomass availability when the flag is on (1.2 = up to 20% above the reference)
biomass_limit_scope: "country"                         # "country" = national limit, summed over each country's nodes (NUTS regions of one country share one limit); "system" = one pooled limit over all nodes (reference-model behaviour)
transmission_availability: 1.0                          # Usable share (0-1) of each line's installed capacity per hour, for reliability margins (e.g. 0.8 = 80% usable). 1.0 = full capacity

# Linear (DC) Optimal Power Flow -- angle-based DC-OPF with binary block line expansion.
# LF_ES_GoRES provides lineReactance (ohms) for AC corridors + per-candidate LineBlockCapacity/
# LineBlockReactance, NominalVoltage=400 kV, and no Sbase sheet (reactances stay in ohms).
lopf_flag: False                                        # Enable DC optimal power flow constraints
lopf_method: "angle"                                   # Angle-based DC-OPF (requires reactance in ohms + NominalVoltage)
lopf_kwargs:                                           # Options for the LOPF / reactance generation
  reactance_per_km: 0.0004                             # Ohm/km fallback; ignored here since a lineReactance sheet is present
  reactance_from_susceptance: False                    # If True, derive reactance X = 1/B from a lineSusceptance input instead
  dc_line_types: ["HVDC_Cable"]                        # HVDC corridors (ES523-ES532, EU-France) excluded from Ohm's law; still capacity-limited

# Spanish case boundary conditions: constrain France/Portugal/EU node capacities and the
# Spanish national totals (sum over NUTS3) to an original aggregated EMPIRE run, and fix
# cross-border corridor capacities (ES-France, ES-Portugal, EU-France) to the original results.
# Requires a 'BoundaryConditions' folder in the dataset, generated by:
#   python scripts/extract_boundary_conditions.py --results "Results/basic_run/dataset_Agg_<X>" --dataset "Data handler/LF_ES_<X>"
use_boundary_conditions: True                          # Enable Spanish-case boundary conditions
boundary_bound_type: "fixed"                           # "fixed" (=) or "upper" (<=) for generation/storage; transmission is always fixed

# Solver (Gurobi) performance options. Leave a value commented/absent to use the Gurobi default.
# Speed: these are the accelerators — use them for large runs.
solver_method: 2                                       # 2 = barrier (interior point), best for large LPs
solver_crossover: 0                                  # DO NOT set 0 with lopf_method "angle": angle expansion is a MIP and the root basis matters for warm starts. Leave commented (Gurobi default) for angle; only use 0 with the kirchhoff (pure-LP) method.
solver_presolve: -1                                     # 2 = aggressive presolve to shrink the matrix
solver_threads: 4                                      # Set to the PHYSICAL core count of the machine the run executes on; avoids hyperthread/NUMA contention (also lowers barrier memory use)
# Robustness (brakes, not accelerators): each of these makes Gurobi SLOWER. Only enable
# one at a time if a run fails with numerical-trouble messages — never preemptively.
# solver_scaleflag: 2                                    # 2 = aggressive matrix scaling (-1=auto, 0=off); scales the matrix only, not the objective
# solver_numericfocus: 1                                 # 1-3 = progressively more numerical care (progressively slower)
# solver_barhomogeneous: 1                               # 1 = homogeneous barrier variant for ill-conditioned/infeasible models (slower)