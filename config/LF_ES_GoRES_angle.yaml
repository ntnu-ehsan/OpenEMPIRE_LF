# Config for the LF_ES_GoRES dataset (GoRES Europe with Spain disaggregated to NUTS3,
# North Sea offshore nodes): angle-based DC-OPF with binary block transmission expansion.
# Run with:  python scripts/run.py -d LF_ES_GoRES -c config/LF_ES_GoRES_angle.yaml
#
# NB: ScenarioData/sampling_key.csv covers periods 1-4 and scenarios 1-3 only, so with
# use_fixed_sample: True keep forecast_horizon_year <= 2040 and number_of_scenarios <= 3.
# Regenerate the sampling key (or set use_fixed_sample: False) to extend either.
use_temporary_directory: True
temporary_directory: './'
forecast_horizon_year: 2040                            # 4 periods (limited by sampling_key.csv; dataset itself has 7)
number_of_scenarios: 3                                 # limited by sampling_key.csv
length_of_regular_season: 168
discount_rate: 0.05
wacc: 0.05
optimization_solver: "Gurobi"
use_scenario_generation: True
use_fixed_sample: True
load_change_module: False
filter_make : False
filter_use : False
copula_clusters_make: False
copula_clusters_use: False
copulas_to_use: ["electricload"]
n_cluster : 8
moment_matching : False
n_tree_compare : 20
use_emission_cap: True
compute_operational_duals: True                        # MIP returns no duals; the fixed-binaries LP re-solve provides prices
print_in_iamc_format: False
write_in_lp_format: False
serialize_instance: False
north_sea: True
aggregate_offshore_nodes_in_IAMC: False
leap_years_investment: 5
time_format: "%d/%m/%Y %H:%M"
use_ramping: False
transmission_availability: 1.0

# Linear (DC) Optimal Power Flow -- angle-based DC-OPF with binary line expansion.
# All 312 corridors are candidates (one 1500 MW block each, buildable at most once).
# HVDC corridors (133, typed HVDC_Cable) are converter-controlled: excluded from Ohm's
# law but still capacity-limited and buildable. Line reactances are in ohms.
lopf_flag: True
lopf_method: "angle"
lopf_kwargs:
  reactance_per_km: 0.0004                             # fallback only; the dataset ships a lineReactance sheet for all AC corridors
  reactance_from_susceptance: False
  dc_line_types: ["HVDC_Cable"]

# MIP (binary line builds): barrier for the relaxations, keep Gurobi's default crossover
# (the root basis matters for MIP warm starts; do NOT set solver_crossover: 0 here).
solver_method: 2
solver_presolve: -1
# solver_threads: 16                                   # set to the physical core count of the cluster node
